name: "Python Test"
description: "Python Test Template"
inputs:
  py:
    required: true
    description: "Target Python Version"
  os:
    required: true
    description: "Target Operating System"
  node:
    required: true
    description: "Target Node.js Major Version"
  tests:
    required: false
    default: "test"
    description: "The Tests To Run"
  compiled:
    required: false
    default: "true"
    description: "Whether The Tests Also Run With The Compiled Modules"
runs:
  using: "composite"
  steps:
    - name: Read Node Answers Of Earlier Runs
      uses: actions/cache/restore@v6
      with:
        path: .pytest_cache/d/node
        key: node-answers-${{ runner.os }}-node${{ inputs.node }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: node-answers-${{ runner.os }}-node${{ inputs.node }}-
    - name: Disable Compiled Modules
      shell: bash
      run: '"$CIPY" setup.py disable_ext'
    - name: Unit Tests (Pure Python)
      if: ${{ contains(inputs.os, 'windows') }}
      shell: cmd
      run: '"%CIPY%" -m pytest -n=6 --dist=worksteal -m "not cythonized_only" ${{ inputs.tests }} 2>NUL'
    - name: Unit Tests (Pure Python)
      if: ${{ contains(inputs.os, 'mac') }}
      shell: bash
      run: '"$CIPY" -m pytest -n=4 --dist=worksteal -m "not cythonized_only" ${{ inputs.tests }}'
    - name: Unit Tests (Pure Python)
      if: ${{ contains(inputs.os, 'ubuntu') }}
      shell: bash
      run: 'XDG_SESSION_TYPE=x11 xvfb-run "$CIPY" -m pytest -n=4 --dist=worksteal -m "not cythonized_only" ${{ inputs.tests }}'
    - name: Prepare Compiled Module Tests
      if: ${{ inputs.compiled == 'true' }}
      shell: bash
      run: '"$CIPY" setup.py build_ext --inplace'
    - name: Unit Tests (Cython Modules)
      if: ${{ inputs.compiled == 'true' && contains(inputs.os, 'windows') }}
      shell: cmd
      run: '"%CIPY%" -m pytest -n=6 --dist=worksteal -m "cythonized or cythonized_only" ${{ inputs.tests }} 2>NUL'
    - name: Unit Tests (Cython Modules)
      if: ${{ inputs.compiled == 'true' && contains(inputs.os, 'mac') }}
      shell: bash
      run: '"$CIPY" -m pytest -n=4 --dist=worksteal -m "cythonized or cythonized_only" ${{ inputs.tests }}'
    - name: Unit Tests (Cython Modules)
      if: ${{ inputs.compiled == 'true' && contains(inputs.os, 'ubuntu') }}
      shell: bash
      run: 'XDG_SESSION_TYPE=x11 xvfb-run "$CIPY" -m pytest -n=4 --dist=worksteal -m "cythonized or cythonized_only" ${{ inputs.tests }}'
    - name: Keep Node Answers For Later Runs
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v6
      with:
        path: .pytest_cache/d/node
        key: node-answers-${{ runner.os }}-node${{ inputs.node }}-${{ github.run_id }}-${{ github.run_attempt }}
