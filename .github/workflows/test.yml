name: tests

on:
  push:
    branches: [ master ]
    tags-ignore: '**'
  pull_request:
    types: [opened, synchronize]
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      REFINERY_STOREPATH: ${{ github.workspace }}/refinery-test-data
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
        os: [windows-latest, macos-15, ubuntu-latest]
    steps:
      - name: Debug Logging
        run: |
          echo "event  = ${{ github.event_name }}"
          echo "action = ${{ github.event.action }}"
      - name: Checkout Main Repository
        uses: actions/checkout@v5
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
      - name: Clone PR Source Repository
        uses: actions/checkout@v5
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Checkout Test Data
        uses: actions/checkout@v5
        with:
          repository: binref/refinery-test-data
          path: refinery-test-data
      - name: Install Dependencies
        uses: ./.github/actions/setup/
        with:
          py: ${{ matrix.python-version }}
          os: ${{ matrix.os }}
      - name: Run Tests
        uses: ./.github/actions/test/
        with:
          py: ${{ matrix.python-version }}
          os: ${{ matrix.os }}

  audit:
    name: audit dependencies
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
        os: [windows-latest, macos-15, ubuntu-latest]
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v5
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
      - name: Clone PR Source Repository
        uses: actions/checkout@v5
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Refinery Into A Fresh Environment
        shell: bash
        run: |
          python -m venv audit-env
          source audit-env/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/activate
          python -m pip install --upgrade pip
          pip install ".[all]"
          pip freeze --exclude binary-refinery > audit-requirements.txt
      - name: Audit Dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: audit-requirements.txt
          no-deps: true
          ignore-vulns: |
            GHSA-4xh5-x5gv-qwph # pip; independent of refinery
                  CVE-2026-3219 # pip; independent of refinery
                  CVE-2026-4539 # pygments bug we won't trigger
                 PYSEC-2024-280 # affects earlier LIEF version

  coverage:
    if: ${{ github.repository_owner == 'binref' }}
    runs-on: windows-latest
    needs: 
      - test
      - audit
    env:
      REFINERY_STOREPATH: ${{ github.workspace }}/refinery-test-data
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Checkout Test Data
      uses: actions/checkout@v5
      with:
        repository: binref/refinery-test-data
        path: refinery-test-data
    - name: Install Dependencies
      uses: ./.github/actions/setup/
      with:
        py: '3.13'
        os: windows-latest
    - name: Install Coverage Dependencies
      run: |
        python -m uv pip install --system pytest pytest-cov
    - name: Read The Node Answers Of The Windows Tests
      uses: actions/cache/restore@v6
      with:
        path: .pytest_cache/d/node
        key: node-answers-Windows-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          node-answers-Windows-${{ github.run_id }}-
          node-answers-Windows-
    - name: Run tests and collect coverage
      run: pytest --disable-warnings --cov-config=.coveragerc --cov refinery -n=4 --dist=worksteal test 2>nul
      shell: cmd
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
        fail_ci_if_error: true
